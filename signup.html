<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizard | Advanced Onboarding</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --gold: #FFD700; --dark: #0a0a0a; --card: #141414; }
        body { background: var(--dark); color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .wizard-card { background: var(--card); padding: 30px; border-radius: 15px; border: 1px solid #333; width: 400px; position: relative; }
        .progress-container { width: 100%; height: 8px; background: #333; border-radius: 4px; margin-bottom: 25px; }
        #progress-fill { height: 100%; background: var(--gold); width: 25%; transition: 0.5s; box-shadow: 0 0 15px var(--gold); }
        .step { display: none; }
        .step.active { display: block; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 6px; box-sizing: border-box; }
        .btn-gold { background: var(--gold); color: black; width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #loading-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: var(--card); z-index: 100; display: flex; justify-content: center; align-items: center; border-radius: 15px; }
    </style>
</head>
<body>
    <div class="wizard-card">
        <div id="loading-overlay">
            <h3 class="animate__animated animate__pulse animate__infinite">🧙‍♂️ Syncing...</h3>
        </div>

        <div class="progress-container"><div id="progress-fill"></div></div>

        <div class="step active" id="phase-1">
            <h2 style="color:var(--gold)">Phase 1: Security</h2>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Access Password">
            <button class="btn-gold" id="btn-1">Next: Identity</button>
        </div>

        <div class="step" id="phase-2">
            <h2 style="color:var(--gold)">Phase 2: Identity</h2>
            <input type="text" id="shopName" placeholder="Shop Name">
            <select id="location"><option>Duhok</option><option>Erbil</option><option>Nashville</option></select>
            <button class="btn-gold" id="btn-2">Next: Synthesis</button>
        </div>

        <div class="step" id="phase-3">
            <h2 style="color:var(--gold)">Final Step</h2>
            <button class="btn-gold" id="final-btn">Finalize Application</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBwT4WTmRLfLKiiO7dnIF7Nfii4niVP_HM",
            authDomain: "repair-wizard-65e13.firebaseapp.com",
            projectId: "repair-wizard-65e13",
            storageBucket: "repair-wizard-65e13.firebasestorage.app",
            messagingSenderId: "158752709879",
            appId: "1:158752709879:web:30f3aaa95b3a120d1187f2"
        };

        // 1. Initialize
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app); // Passing 'app' directly ensures registration
        const db = getFirestore(app);

        // 2. Hide Loader
        document.getElementById('loading-overlay').style.display = 'none';

        // 3. Multi-step Logic
        const move = (p) => {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById(`phase-${p}`).classList.add('active');
            document.getElementById('progress-fill').style.width = (p * 33) + "%";
        };

        document.getElementById('btn-1').onclick = () => move(2);
        document.getElementById('btn-2').onclick = () => move(3);

        document.getElementById('final-btn').onclick = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const shop = document.getElementById('shopName').value;
            const loc = document.getElementById('location').value;

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, pass);
                await setDoc(doc(db, "partners", cred.user.uid), {
                    shopName: shop,
                    location: loc,
                    status: "pending",
                    joinedAt: serverTimestamp()
                });
                alert("Application Sent!");
                window.location.href = "partner_portal.html";
            } catch (e) { alert(e.message); }
        };
    </script>
</body>
</html>
