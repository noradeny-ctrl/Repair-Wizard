        .pt-safe { padding-top: env(safe-area-inset-top); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        
        ::-webkit-scrollbar { width: 0px; }
        
        .spell-loader {
            width: 60px;
            height: 60px;
            position: relative;
        }
        .spell-loader div {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;

            border-radius: 50%;

        @keyframes spell-spin {

    <!-- Inline script for partner logic - unified with the main importmap -->
    <script type="module">
      import { initializeApp, getApps, getApp } from "firebase/app";
      import { getAuth, createUserWithEmailAndPassword, sendEmailVerification } from "firebase/auth";
      import { getFirestore, doc, setDoc, serverTimestamp } from "firebase/firestore";

      const firebaseConfig = {
        apiKey: "AIzaSyBwT4WTmRLfLKiiO7dnIF7Nfii4niVP_HM",
        authDomain: "repair-wizard-65e13.firebaseapp.com",
        projectId: "repair-wizard-65e13",
        storageBucket: "repair-wizard-65e13.firebasestorage.app",
        messagingSenderId: "158752709879",
        appId: "1:158752709879:web:30f3aaa95b3a120d1187f2",
        measurementId: "G-0SFG0PWV6D"
      };

      // Unify app initialization to share registry
      const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
      const auth = getAuth(app);       
      const db = getFirestore(app);    

      console.log("Repair Wizard Internal Auth Bridge Initialized");

      window.submitApplication = async function(event) {
          event.preventDefault(); 
          
          const email = document.getElementById('partner-email').value;
          const password = document.getElementById('partner-pass').value;
          const shopName = document.getElementById('shop-name').value;
          const location = document.getElementById('shop-location').value;
          const phone = document.getElementById('shop-phone').value;
          const statusMsg = document.getElementById('status-message');

          if(password.length < 6) {
              alert("Password must be at least 6 characters.");
              return;
          }

          statusMsg.innerText = "Creating Account...";
          statusMsg.style.color = "orange";

          try {
              const userCredential = await createUserWithEmailAndPassword(auth, email, password);
              const user = userCredential.user;

              await sendEmailVerification(user);

              await setDoc(doc(db, "partners", user.uid), {
                  shopName: shopName,
                  email: email,
                  location: location,
                  phone: phone,
                  status: "pending", 
                  appliedAt: serverTimestamp()
              });

              document.getElementById('application-form').style.display = 'none';
              document.getElementById('pending-screen').style.display = 'block';
              console.log("Success! Account created.");

          } catch (error) {
              console.error("Signup Error:", error);
              statusMsg.style.color = "red";
              statusMsg.innerText = "Error: " + error.message;
          }
      }
    </script>
