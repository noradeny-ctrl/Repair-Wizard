<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Repair Wizard">
    <meta name="format-detection" content="telephone=no">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://esm.sh">
    
    <title>Repair Wizard | Partner Onboarding</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root {
            --wizard-blue: #3b82f6;
            --wizard-cyan: #22d3ee;
            --wizard-purple: #8b5cf6;
        }

        body {
            font-family: -apple-system, 'Plus Jakarta Sans', sans-serif;
            background-color: #000000;
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            overscroll-behavior: none;
            touch-action: manipulation;
            overflow-x: hidden;
        }

        [dir="rtl"], .font-ku {
            font-family: 'Noto Sans Arabic', -apple-system, sans-serif !important;
            letter-spacing: 0 !important;
        }

        .nebula {
            position: fixed;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle at 30% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 70% 70%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
            filter: blur(80px);
            z-index: -1;
            animation: nebula-float 15s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes nebula-float {
            0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
            50% { transform: scale(1.1) translate(-2%, 2%); opacity: 0.4; }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.2;
            pointer-events: none;
        }

        .pt-safe { padding-top: env(safe-area-inset-top); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        
        ::-webkit-scrollbar { width: 0px; }
    </style>
    
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@19.0.0/",
    "react/": "https://esm.sh/react@19.0.0/",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "firebase/app": "https://esm.sh/firebase@11.2.0/app",
    "firebase/auth": "https://esm.sh/firebase@11.2.0/auth",
    "firebase/firestore": "https://esm.sh/firebase@11.2.0/firestore",
    "firebase/": "https://esm.sh/firebase@^12.9.0/"
  }
}
</script>
</head>
<body class="bg-black text-slate-100">
    <div class="nebula"></div>
    <div class="stars"></div>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
